# ============================================
# Hephaestus RAG 后端 - 主配置文件
# ============================================

app:
  host: "0.0.0.0"
  port: 8000
  title: "Hephaestus Chat Proxy"
  # CORS 允许的来源，* 表示全部
  cors_origins:
    - "*"

# 105 生产：访问 10.61.13.137 上的 Ollama。
# 本机调试不要改这里，用 gitignore 的 config/local.yaml 覆盖为云上 Qwen。
ollama:
  provider: ollama
  chat_url: "http://10.61.13.137:11434/api/chat"
  tags_url: "http://10.61.13.137:11434/api/tags"
  model: "qwen3.5:9b"
  timeout: 300.0          # 请求超时（秒）
  num_gpu: 99            # GPU 加速，99 表示全 GPU
  keep_alive: "24h"      # 模型在内存中保持的时间
  # 是否启用 thinking 模式（qwen3.5 默认会先生成大量 thinking，关闭可降低延迟）
  think: false

model_defaults:
  num_ctx: 20480          # 上下文窗口大小
  temperature: 0.6        # 温度参数
  num_predict: 20480      # 默认最大生成 token 数（SQL、检测等短输出场景）
  num_predict_report: 2048   # 报告生成场景的最大 token 数（长输出），2048 足够覆盖 summary+suggestions+warnings

